services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mephi_journals
      POSTGRES_USER: mephi
      POSTGRES_PASSWORD: mephi
    ports:
      - "5432:5432"
    volumes:
      - mephi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mephi -d mephi_journals"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  updater:
    build: .
    entrypoint: ["python", "-m", "src.pipeline.update"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  mephi_pgdata:
